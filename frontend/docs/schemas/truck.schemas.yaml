components:
  schemas:
    Truck:
      type: object
      required:
        - matricule
        - brand
        - model
        - yearOfManufacture
        - fuelType
        - currentMileage
      properties:
        _id:
          type: string
          description: Auto-generated MongoDB ID
          example: "507f1f77bcf86cd799439011"
        matricule:
          type: string
          pattern: "^[A-Z0-9-]+$"
          minLength: 3
          maxLength: 20
          description: Truck registration number (unique, uppercase alphanumeric with hyphens)
          example: "TRK-001"
        brand:
          type: string
          minLength: 2
          maxLength: 100
          description: Truck brand/manufacturer
          example: "Volvo"
        model:
          type: string
          minLength: 1
          maxLength: 100
          description: Truck model
          example: "FH16"
        yearOfManufacture:
          type: integer
          minimum: 1900
          description: Year the truck was manufactured
          example: 2020
        status:
          type: string
          enum: [Disponible, En Mission, En Maintenance]
          default: Disponible
          description: Current operational status of the truck
          example: "Disponible"
        currentMileage:
          type: integer
          minimum: 0
          maximum: 10000000
          default: 0
          description: Current odometer reading in kilometers
          example: 150000
        fuelType:
          type: string
          enum: [Diesel, Gasoline, Other]
          description: Type of fuel used by the truck
          example: "Diesel"
        createdAt:
          type: string
          format: date-time
          description: Record creation timestamp
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2024-01-20T14:45:00Z"

    TruckInput:
      type: object
      required:
        - matricule
        - brand
        - model
        - yearOfManufacture
        - fuelType
      properties:
        matricule:
          type: string
          pattern: "^[A-Z0-9-]+$"
          example: "TRK-001"
          description: Must be uppercase alphanumeric with hyphens only
        brand:
          type: string
          example: "Volvo"
        model:
          type: string
          example: "FH16"
        yearOfManufacture:
          type: integer
          example: 2020
          minimum: 1900
        status:
          type: string
          enum: [Disponible, En Mission, En Maintenance]
          example: "Disponible"
        currentMileage:
          type: integer
          minimum: 0
          example: 150000
          description: Optional, defaults to 0
        fuelType:
          type: string
          enum: [Diesel, Gasoline, Other]
          example: "Diesel"

    TruckUpdate:
      type: object
      properties:
        matricule:
          type: string
          pattern: "^[A-Z0-9-]+$"
          example: "TRK-001"
        brand:
          type: string
          example: "Volvo"
        model:
          type: string
          example: "FH16"
        yearOfManufacture:
          type: integer
          example: 2020
        status:
          type: string
          enum: [Disponible, En Mission, En Maintenance]
          example: "En Mission"
        currentMileage:
          type: integer
          example: 155000
        fuelType:
          type: string
          enum: [Diesel, Gasoline, Other]
          example: "Diesel"

    TruckStatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [Disponible, En Mission, En Maintenance]
          example: "En Maintenance"

    TruckStats:
      type: object
      properties:
        total:
          type: integer
          description: Total number of trucks
          example: 50
        available:
          type: integer
          description: Number of available trucks
          example: 30
        onMission:
          type: integer
          description: Number of trucks on mission
          example: 15
        inMaintenance:
          type: integer
          description: Number of trucks in maintenance
          example: 5
        byBrand:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
                example: "Volvo"
              count:
                type: integer
                example: 20
        averageMileage:
          type: number
          description: Average mileage across all trucks
          example: 125000
