components:
  schemas:
    Trailer:
      type: object
      required:
        - matricule
        - type
        - maximumLoad
      properties:
        _id:
          type: string
          description: Auto-generated MongoDB ID
          example: "507f1f77bcf86cd799439011"
        matricule:
          type: string
          description: Trailer registration number (unique, uppercase)
          example: "TRL-001"
        type:
          type: string
          enum: [Frigo, Plateau, Fourgon, Citerne, Benne, Porte-conteneur]
          description: Type/category of trailer
          example: "Frigo"
        maximumLoad:
          type: number
          minimum: 0
          description: Maximum load capacity in kilograms
          example: 25000
        status:
          type: string
          enum: [Disponible, En Mission, En Maintenance]
          default: Disponible
          description: Current operational status
          example: "Disponible"
        currentMileage:
          type: number
          minimum: 0
          default: 0
          description: Current odometer reading in kilometers
          example: 50000
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-20T14:45:00Z"

    TrailerInput:
      type: object
      required:
        - matricule
        - type
        - maximumLoad
      properties:
        matricule:
          type: string
          example: "TRL-001"
        type:
          type: string
          enum: [Frigo, Plateau, Fourgon, Citerne, Benne, Porte-conteneur]
          example: "Frigo"
        maximumLoad:
          type: number
          minimum: 0
          example: 25000
        status:
          type: string
          enum: [Disponible, En Mission, En Maintenance]
          example: "Disponible"
        currentMileage:
          type: number
          minimum: 0
          example: 50000

    TrailerUpdate:
      type: object
      properties:
        matricule:
          type: string
          example: "TRL-001"
        type:
          type: string
          enum: [Frigo, Plateau, Fourgon, Citerne, Benne, Porte-conteneur]
          example: "Plateau"
        maximumLoad:
          type: number
          example: 30000
        status:
          type: string
          enum: [Disponible, En Mission, En Maintenance]
          example: "En Mission"
        currentMileage:
          type: number
          example: 55000

    TrailerStatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [Disponible, En Mission, En Maintenance]
          example: "En Maintenance"

    TrailerStats:
      type: object
      properties:
        total:
          type: integer
          example: 40
        available:
          type: integer
          example: 25
        onMission:
          type: integer
          example: 10
        inMaintenance:
          type: integer
          example: 5
        byType:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
                example: "Frigo"
              count:
                type: integer
                example: 15
