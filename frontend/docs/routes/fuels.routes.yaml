/api/fuels:
  get:
    tags:
      - Fuel
    summary: Get all fuel records
    description: Retrieve a list of all fuel consumption records with optional filters
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: startDate
        schema:
          type: string
          format: date
        description: Filter records from this date
      - in: query
        name: endDate
        schema:
          type: string
          format: date
        description: Filter records until this date
      - in: query
        name: linkedDriver
        schema:
          type: string
        description: Filter by driver ID
      - in: query
        name: linkedVehicle
        schema:
          type: string
        description: Filter by vehicle ID
    responses:
      "200":
        description: List of fuel records retrieved successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Fuel"
      "401":
        description: Unauthorized

  post:
    tags:
      - Fuel
    summary: Create a new fuel record
    description: Add a new fuel consumption record (Admin only)
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FuelInput"
    responses:
      "201":
        description: Fuel record created successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Fuel"
      "400":
        description: Invalid input data
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

/api/fuels/stats:
  get:
    tags:
      - Fuel
    summary: Get fuel consumption statistics
    description: Get aggregated statistics about fuel consumption (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: startDate
        schema:
          type: string
          format: date
        description: Start date for statistics period
      - in: query
        name: endDate
        schema:
          type: string
          format: date
        description: End date for statistics period
    responses:
      "200":
        description: Fuel statistics retrieved successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FuelStats"
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

/api/fuels/driver/{driverId}:
  get:
    tags:
      - Fuel
    summary: Get fuel records by driver
    description: Retrieve all fuel records for a specific driver
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: driverId
        required: true
        schema:
          type: string
        description: Driver (User) ID
    responses:
      "200":
        description: List of fuel records for the specified driver
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Fuel"
      "404":
        description: Driver not found
      "401":
        description: Unauthorized

