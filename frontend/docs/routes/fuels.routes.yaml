/api/fuels/{id}:
  get:
    tags:
      - Fuel
    summary: Get fuel record by ID
    description: Retrieve a specific fuel record's details
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Fuel record ID
    responses:
      "200":
        description: Fuel record retrieved successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Fuel"
      "404":
        description: Fuel record not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      "401":
        description: Unauthorized

  put:
    tags:
      - Fuel
    summary: Update fuel record
    description: Update a fuel record's information (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Fuel record ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FuelUpdate"
    responses:
      "200":
        description: Fuel record updated successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Fuel"
      "400":
        description: Invalid input data
      "404":
        description: Fuel record not found
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

  delete:
    tags:
      - Fuel
    summary: Delete fuel record
    description: Delete a fuel record (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Fuel record ID
    responses:
      "200":
        description: Fuel record deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Fuel record deleted successfully"
      "404":
        description: Fuel record not found
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required
