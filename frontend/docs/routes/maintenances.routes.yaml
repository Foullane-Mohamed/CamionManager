/api/maintenances:
  get:
    tags:
      - Maintenance
    summary: Get all maintenance records
    description: Retrieve a list of all maintenance records with optional filters (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: maintenanceType
        schema:
          type: string
          enum: [Tire Replacement, Oil Change, Vehicle Revision, Other]
        description: Filter by maintenance type
      - in: query
        name: linkedVehicle
        schema:
          type: string
        description: Filter by vehicle ID
      - in: query
        name: status
        schema:
          type: string
          enum: [Scheduled, In Progress, Completed, Cancelled]
        description: Filter by maintenance status
      - in: query
        name: isAlertTriggered
        schema:
          type: boolean
        description: Filter by alert-triggered maintenances
      - in: query
        name: startDate
        schema:
          type: string
          format: date
        description: Filter maintenance records from this date
      - in: query
        name: endDate
        schema:
          type: string
          format: date
        description: Filter maintenance records until this date
    responses:
      "200":
        description: List of maintenance records retrieved successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Maintenance"
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

  post:
    tags:
      - Maintenance
    summary: Create a new maintenance record
    description: Add a new maintenance record (Admin only)
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MaintenanceInput"
    responses:
      "201":
        description: Maintenance record created successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Maintenance"
      "400":
        description: Invalid input data (e.g., vehicle not found, mileage issues)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

/api/maintenances/stats:
  get:
    tags:
      - Maintenance
    summary: Get maintenance statistics
    description: Get aggregated statistics about maintenance records (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: startDate
        schema:
          type: string
          format: date
        description: Start date for statistics period
      - in: query
        name: endDate
        schema:
          type: string
          format: date
        description: End date for statistics period
    responses:
      "200":
        description: Maintenance statistics retrieved successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceStats"
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

/api/maintenances/vehicle/{vehicleId}:
  get:
    tags:
      - Maintenance
    summary: Get maintenance records by vehicle
    description: Retrieve all maintenance records for a specific vehicle (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: vehicleId
        required: true
        schema:
          type: string
        description: Vehicle (Truck) ID
    responses:
      "200":
        description: List of maintenance records for the specified vehicle
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Maintenance"
      "404":
        description: Vehicle not found
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

