components:
  schemas:
    Maintenance:
      type: object
      required:
        - maintenanceType
        - linkedVehicle
        - maintenanceDate
        - vehicleMileageAtMaintenance
        - cost
        - serviceProvider
        - performedBy
      properties:
        _id:
          type: string
          description: Auto-generated MongoDB ID
          example: "507f1f77bcf86cd799439011"
        maintenanceNumber:
          type: string
          description: Auto-generated unique maintenance number
          example: "MAINT-2024-001"
        maintenanceType:
          type: string
          enum: [Tire Replacement, Oil Change, Vehicle Revision, Other]
          description: Type of maintenance performed
          example: "Oil Change"
        linkedVehicle:
          type: string
          description: ID of the vehicle that received maintenance
          example: "507f1f77bcf86cd799439012"
        linkedRule:
          type: string
          nullable: true
          description: ID of the maintenance rule that triggered this maintenance (if applicable)
          example: "507f1f77bcf86cd799439013"
        maintenanceDate:
          type: string
          format: date-time
          description: Date and time when maintenance was performed
          example: "2024-01-15T10:00:00Z"
        vehicleMileageAtMaintenance:
          type: number
          minimum: 0
          description: Vehicle's odometer reading at time of maintenance (km)
          example: 150000
        nextMaintenanceDueDate:
          type: string
          format: date-time
          nullable: true
          description: Next scheduled maintenance date
          example: "2024-07-15T00:00:00Z"
        nextMaintenanceDueMileage:
          type: number
          minimum: 0
          nullable: true
          description: Next maintenance due at this mileage (km)
          example: 160000
        cost:
          type: number
          minimum: 0
          description: Total cost of maintenance
          example: 2500.00
        serviceProvider:
          type: string
          description: Name of service provider/garage
          example: "AutoService Pro"
        description:
          type: string
          description: Detailed description of maintenance performed
          example: "Complete oil change with filter replacement"
        partsReplaced:
          type: array
          description: List of parts that were replaced
          items:
            type: object
            properties:
              partName:
                type: string
                example: "Oil Filter"
              quantity:
                type: number
                example: 1
              unitPrice:
                type: number
                example: 150.00
        isAlertTriggered:
          type: boolean
          default: false
          description: Whether this maintenance was triggered by an alert
          example: true
        alertType:
          type: string
          enum: [Mileage, Time, Both, Manual]
          default: Manual
          description: Type of alert that triggered the maintenance
          example: "Both"
        status:
          type: string
          enum: [Scheduled, In Progress, Completed, Cancelled]
          default: Completed
          description: Current status of maintenance
          example: "Completed"
        performedBy:
          type: string
          description: ID of user who recorded/performed the maintenance
          example: "507f1f77bcf86cd799439014"
        remarks:
          type: string
          description: Additional remarks or notes
          example: "Vehicle running smoothly after maintenance"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-15T12:00:00Z"

    MaintenanceInput:
      type: object
      required:
        - maintenanceType
        - linkedVehicle
        - maintenanceDate
        - vehicleMileageAtMaintenance
        - cost
        - serviceProvider
      properties:
        maintenanceType:
          type: string
          enum: [Tire Replacement, Oil Change, Vehicle Revision, Other]
          example: "Oil Change"
        linkedVehicle:
          type: string
          example: "507f1f77bcf86cd799439012"
        linkedRule:
          type: string
          nullable: true
          example: "507f1f77bcf86cd799439013"
        maintenanceDate:
          type: string
          format: date-time
          example: "2024-01-15T10:00:00Z"
        vehicleMileageAtMaintenance:
          type: number
          example: 150000
        nextMaintenanceDueDate:
          type: string
          format: date-time
          example: "2024-07-15T00:00:00Z"
        nextMaintenanceDueMileage:
          type: number
          example: 160000
        cost:
          type: number
          example: 2500.00
        serviceProvider:
          type: string
          example: "AutoService Pro"
        description:
          type: string
          example: "Complete oil change with filter replacement"
        partsReplaced:
          type: array
          items:
            type: object
            properties:
              partName:
                type: string
              quantity:
                type: number
              unitPrice:
                type: number
        isAlertTriggered:
          type: boolean
          example: true
        alertType:
          type: string
          enum: [Mileage, Time, Both, Manual]
          example: "Both"
        status:
          type: string
          enum: [Scheduled, In Progress, Completed, Cancelled]
          example: "Completed"
        remarks:
          type: string
          example: "Maintenance completed successfully"

    MaintenanceUpdate:
      type: object
      properties:
        maintenanceType:
          type: string
          enum: [Tire Replacement, Oil Change, Vehicle Revision, Other]
          example: "Vehicle Revision"
        linkedVehicle:
          type: string
          example: "507f1f77bcf86cd799439012"
        linkedRule:
          type: string
          example: "507f1f77bcf86cd799439013"
        maintenanceDate:
          type: string
          format: date-time
          example: "2024-01-15T10:00:00Z"
        vehicleMileageAtMaintenance:
          type: number
          example: 150500
        nextMaintenanceDueDate:
          type: string
          format: date-time
          example: "2024-08-15T00:00:00Z"
        nextMaintenanceDueMileage:
          type: number
          example: 165000
        cost:
          type: number
          example: 3000.00
        serviceProvider:
          type: string
          example: "Premium Auto Center"
        description:
          type: string
          example: "Updated maintenance description"
        status:
          type: string
          enum: [Scheduled, In Progress, Completed, Cancelled]
          example: "In Progress"
        remarks:
          type: string
          example: "Additional work required"

    MaintenanceStatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [Scheduled, In Progress, Completed, Cancelled]
          example: "Completed"

    MaintenanceAlert:
      type: object
      properties:
        vehicleId:
          type: string
          example: "507f1f77bcf86cd799439012"
        vehicleMatricule:
          type: string
          example: "TRK-001"
        maintenanceType:
          type: string
          example: "Oil Change"
        ruleId:
          type: string
          example: "507f1f77bcf86cd799439013"
        alertType:
          type: string
          enum: [Mileage, Time, Both]
          example: "Both"
        currentMileage:
          type: number
          example: 160500
        lastMaintenanceDate:
          type: string
          format: date-time
          nullable: true
          example: "2024-01-15T10:00:00Z"
        lastMaintenanceMileage:
          type: number
          nullable: true
          example: 150000
        thresholdMileage:
          type: number
          example: 10000
        thresholdDays:
          type: number
          example: 180
        message:
          type: string
          example: "Oil Change required for TRK-001"

    MaintenanceStats:
      type: object
      properties:
        totalMaintenances:
          type: integer
          description: Total number of maintenance records
          example: 250
        totalCost:
          type: number
          description: Total cost of all maintenances
          example: 625000.00
        byType:
          type: array
          description: Maintenance records grouped by type
          items:
            type: object
            properties:
              _id:
                type: string
                example: "Oil Change"
              count:
                type: integer
                example: 100
              totalCost:
                type: number
                example: 250000.00
        byVehicle:
          type: array
          description: Top 10 vehicles by maintenance frequency
          items:
            type: object
            properties:
              vehicleId:
                type: string
              vehicleMatricule:
                type: string
                example: "TRK-001"
              count:
                type: integer
                example: 15
              totalCost:
                type: number
                example: 37500.00
        byStatus:
          type: array
          description: Maintenance records grouped by status
          items:
            type: object
            properties:
              _id:
                type: string
                example: "Completed"
              count:
                type: integer
                example: 220
        alertTriggered:
          type: integer
          description: Number of maintenances triggered by alerts
          example: 180
