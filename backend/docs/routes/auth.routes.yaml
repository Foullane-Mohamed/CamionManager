/auth/register:
  post:
    tags:
      - Auth
    summary: Register a new user
    description: |
      Create a new user account. 
      - **Admin accounts** are automatically approved
      - **Chauffeur accounts** require admin approval (status starts as "pending")
      - Chauffeurs must provide additional information (phone, nationalId, licenseNumber, etc.)
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserRegister"
          examples:
            admin:
              summary: Admin registration
              value:
                name: "Admin User"
                email: "admin@example.com"
                password: "admin123"
                role: "admin"
            chauffeur:
              summary: Chauffeur registration
              value:
                name: "John Driver"
                email: "john.driver@example.com"
                password: "driver123"
                role: "chauffeur"
                phoneNumber: "1234567890"
                nationalId: "NAT123456"
                licenseNumber: "LIC789012"
                licenseType: "C"
                address: "123 Main Street, City, Country"
    responses:
      "201":
        description: User registered successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthResponse"
      "400":
        description: Invalid input data
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      "409":
        description: User already exists (email, nationalId, or licenseNumber conflict)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"

/auth/login:
  post:
    tags:
      - Auth
    summary: User login
    description: |
      Authenticate user and receive JWT token.
      - Chauffeur accounts must be approved by admin before login
      - Token should be included in Authorization header for protected routes: `Bearer <token>`
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserLogin"
          example:
            email: "admin@example.com"
            password: "password123"
    responses:
      "200":
        description: Login successful
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthResponse"
      "401":
        description: Invalid credentials or account not approved
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
            examples:
              invalidCredentials:
                summary: Invalid email or password
                value:
                  message: "Invalid email or password"
              notApproved:
                summary: Account pending approval
                value:
                  message: "Your account is pending approval"
              rejected:
                summary: Account rejected
                value:
                  message: "Your account has been rejected"

/auth/refresh:
  post:
    tags:
      - Auth
    summary: Refresh access token
    description: Get a new access token using refresh token
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - refreshToken
            properties:
              refreshToken:
                type: string
                description: Refresh token received during login
    responses:
      "200":
        description: Token refreshed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: New JWT access token
      "401":
        description: Invalid or expired refresh token
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"

/auth/logout:
  post:
    tags:
      - Auth
    summary: User logout
    description: Logout user and invalidate token
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Logout successful
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Logged out successfully"
      "401":
        description: Unauthorized - Invalid or missing token
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"

/auth/profile:
  get:
    tags:
      - Auth
    summary: Get current user profile
    description: Retrieve the authenticated user's profile information
    security:
      - bearerAuth: []
    responses:
      "200":
        description: User profile retrieved successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfile"
      "401":
        description: Unauthorized - Invalid or missing token
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
