/trips:
  get:
    tags:
      - Trips
    summary: Get all trips
    description: Retrieve a list of all trips with optional filters
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: status
        schema:
          type: string
          enum: [À faire, En cours, Terminé]
        description: Filter by trip status
      - in: query
        name: startDate
        schema:
          type: string
          format: date
        description: Filter trips starting from this date
      - in: query
        name: endDate
        schema:
          type: string
          format: date
        description: Filter trips ending before this date
    responses:
      "200":
        description: List of trips retrieved successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Trip"
      "401":
        description: Unauthorized

  post:
    tags:
      - Trips
    summary: Create a new trip
    description: Create a new trip assignment (Admin only)
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TripInput"
    responses:
      "201":
        description: Trip created successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Trip"
      "400":
        description: Invalid input data (e.g., truck/driver not available, invalid dates)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

/trips/stats:
  get:
    tags:
      - Trips
    summary: Get trip statistics
    description: Get aggregated statistics about trips (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: startDate
        schema:
          type: string
          format: date
        description: Start date for statistics period
      - in: query
        name: endDate
        schema:
          type: string
          format: date
        description: End date for statistics period
    responses:
      "200":
        description: Trip statistics retrieved successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripStats"
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

/trips/status/{status}:
  get:
    tags:
      - Trips
    summary: Get trips by status
    description: Retrieve all trips with a specific status
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: status
        required: true
        schema:
          type: string
          enum: [À faire, En cours, Terminé]
        description: Trip status
    responses:
      "200":
        description: List of trips with specified status
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Trip"
      "401":
        description: Unauthorized

/trips/driver/{driverId}:
  get:
    tags:
      - Trips
    summary: Get trips by driver
    description: Retrieve all trips assigned to a specific driver
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: driverId
        required: true
        schema:
          type: string
        description: Driver (User) ID
    responses:
      "200":
        description: List of trips for the specified driver
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Trip"
      "404":
        description: Driver not found
      "401":
        description: Unauthorized

/trips/truck/{truckId}:
  get:
    tags:
      - Trips
    summary: Get trips by truck
    description: Retrieve all trips assigned to a specific truck
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: truckId
        required: true
        schema:
          type: string
        description: Truck ID
    responses:
      "200":
        description: List of trips for the specified truck
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Trip"
      "404":
        description: Truck not found
      "401":
        description: Unauthorized

/trips/{id}:
  get:
    tags:
      - Trips
    summary: Get trip by ID
    description: Retrieve a specific trip's details
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Trip ID
    responses:
      "200":
        description: Trip retrieved successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Trip"
      "404":
        description: Trip not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      "401":
        description: Unauthorized

  put:
    tags:
      - Trips
    summary: Update trip
    description: Update a trip's information (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Trip ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TripUpdate"
    responses:
      "200":
        description: Trip updated successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Trip"
      "400":
        description: Invalid input data
      "404":
        description: Trip not found
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

  delete:
    tags:
      - Trips
    summary: Delete trip
    description: Delete a trip (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Trip ID
    responses:
      "200":
        description: Trip deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Trip deleted successfully"
      "404":
        description: Trip not found
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

/trips/{id}/status:
  patch:
    tags:
      - Trips
    summary: Update trip status
    description: Update only the status of a trip (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Trip ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TripStatusUpdate"
    responses:
      "200":
        description: Trip status updated successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Trip"
      "400":
        description: Invalid status value or missing required fields
      "404":
        description: Trip not found
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

/trips/{id}/pdf:
  get:
    tags:
      - Trips
    summary: Generate mission order PDF
    description: Generate and download mission order PDF for a trip
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Trip ID
    responses:
      "200":
        description: PDF generated successfully
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      "404":
        description: Trip not found
      "401":
        description: Unauthorized
