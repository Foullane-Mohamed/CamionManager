/users/admin:
  post:
    tags:
      - Users
    summary: Create a new admin user
    description: Create a new administrator account (Admin only)
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - email
              - password
            properties:
              name:
                type: string
                example: "New Admin"
              email:
                type: string
                format: email
                example: "newadmin@example.com"
              password:
                type: string
                format: password
                minLength: 6
                example: "admin123"
    responses:
      "201":
        description: Admin user created successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      "400":
        description: Invalid input data
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      "401":
        description: Unauthorized - Invalid or missing token
      "403":
        description: Forbidden - Admin role required

/users:
  get:
    tags:
      - Users
    summary: Get all users
    description: Retrieve a list of all users (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: role
        schema:
          type: string
          enum: [admin, chauffeur]
        description: Filter by user role
      - in: query
        name: accountStatus
        schema:
          type: string
          enum: [pending, approved, rejected]
        description: Filter by account status
    responses:
      "200":
        description: List of users retrieved successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/User"
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

/users/pending:
  get:
    tags:
      - Users
    summary: Get pending chauffeur accounts
    description: Retrieve all chauffeur accounts awaiting approval (Admin only)
    security:
      - bearerAuth: []
    responses:
      "200":
        description: List of pending chauffeurs retrieved successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/User"
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

/users/{id}:
  get:
    tags:
      - Users
    summary: Get user by ID
    description: Retrieve a specific user's details (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: User ID
    responses:
      "200":
        description: User retrieved successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      "404":
        description: User not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

  delete:
    tags:
      - Users
    summary: Delete user
    description: Delete a user account (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: User ID
    responses:
      "200":
        description: User deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "User deleted successfully"
      "404":
        description: User not found
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

/users/{id}/approve:
  put:
    tags:
      - Users
    summary: Update account status
    description: Approve, reject, or update a user's account status (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: User ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - accountStatus
            properties:
              accountStatus:
                type: string
                enum: [pending, approved, rejected]
                description: New account status
                example: "approved"
    responses:
      "200":
        description: Account status updated successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      "400":
        description: Invalid status value
      "404":
        description: User not found
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required
