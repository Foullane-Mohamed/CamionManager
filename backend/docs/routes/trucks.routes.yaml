/trucks:
  get:
    tags:
      - Trucks
    summary: Get all trucks
    description: Retrieve a list of all trucks with optional filters
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: status
        schema:
          type: string
          enum: [Disponible, En Mission, En Maintenance]
        description: Filter by truck status
      - in: query
        name: brand
        schema:
          type: string
        description: Filter by truck brand
      - in: query
        name: fuelType
        schema:
          type: string
          enum: [Diesel, Gasoline, Other]
        description: Filter by fuel type
    responses:
      "200":
        description: List of trucks retrieved successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Truck"
      "401":
        description: Unauthorized

  post:
    tags:
      - Trucks
    summary: Create a new truck
    description: Add a new truck to the fleet (Admin only)
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TruckInput"
    responses:
      "201":
        description: Truck created successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Truck"
      "400":
        description: Invalid input data or duplicate matricule
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

/trucks/stats:
  get:
    tags:
      - Trucks
    summary: Get truck statistics
    description: Get aggregated statistics about the truck fleet (Admin only)
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Truck statistics retrieved successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TruckStats"
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

/trucks/available:
  get:
    tags:
      - Trucks
    summary: Get available trucks
    description: Retrieve all trucks with "Disponible" status
    security:
      - bearerAuth: []
    responses:
      "200":
        description: List of available trucks
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Truck"
      "401":
        description: Unauthorized

/trucks/{id}:
  get:
    tags:
      - Trucks
    summary: Get truck by ID
    description: Retrieve a specific truck's details
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Truck ID
    responses:
      "200":
        description: Truck retrieved successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Truck"
      "404":
        description: Truck not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      "401":
        description: Unauthorized

  put:
    tags:
      - Trucks
    summary: Update truck
    description: Update a truck's information (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Truck ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TruckUpdate"
    responses:
      "200":
        description: Truck updated successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Truck"
      "400":
        description: Invalid input data
      "404":
        description: Truck not found
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

  delete:
    tags:
      - Trucks
    summary: Delete truck
    description: Delete a truck from the fleet (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Truck ID
    responses:
      "200":
        description: Truck deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Truck deleted successfully"
      "404":
        description: Truck not found
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

/trucks/{id}/status:
  patch:
    tags:
      - Trucks
    summary: Update truck status
    description: Update only the status of a truck (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Truck ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TruckStatusUpdate"
    responses:
      "200":
        description: Truck status updated successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Truck"
      "400":
        description: Invalid status value
      "404":
        description: Truck not found
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required
