/trailers:
  get:
    tags:
      - Trailers
    summary: Get all trailers
    description: Retrieve a list of all trailers with optional filters
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: status
        schema:
          type: string
          enum: [Disponible, En Mission, En Maintenance]
        description: Filter by trailer status
      - in: query
        name: type
        schema:
          type: string
          enum: [Frigo, Plateau, Fourgon, Citerne, Benne, Porte-conteneur]
        description: Filter by trailer type
    responses:
      "200":
        description: List of trailers retrieved successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Trailer"
      "401":
        description: Unauthorized

  post:
    tags:
      - Trailers
    summary: Create a new trailer
    description: Add a new trailer to the fleet (Admin only)
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TrailerInput"
    responses:
      "201":
        description: Trailer created successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Trailer"
      "400":
        description: Invalid input data or duplicate matricule
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

/trailers/stats:
  get:
    tags:
      - Trailers
    summary: Get trailer statistics
    description: Get aggregated statistics about the trailer fleet (Admin only)
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Trailer statistics retrieved successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrailerStats"
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

/trailers/available:
  get:
    tags:
      - Trailers
    summary: Get available trailers
    description: Retrieve all trailers with "Disponible" status
    security:
      - bearerAuth: []
    responses:
      "200":
        description: List of available trailers
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Trailer"
      "401":
        description: Unauthorized

/trailers/{id}:
  get:
    tags:
      - Trailers
    summary: Get trailer by ID
    description: Retrieve a specific trailer's details
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Trailer ID
    responses:
      "200":
        description: Trailer retrieved successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Trailer"
      "404":
        description: Trailer not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      "401":
        description: Unauthorized

  put:
    tags:
      - Trailers
    summary: Update trailer
    description: Update a trailer's information (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Trailer ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TrailerUpdate"
    responses:
      "200":
        description: Trailer updated successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Trailer"
      "400":
        description: Invalid input data
      "404":
        description: Trailer not found
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

  delete:
    tags:
      - Trailers
    summary: Delete trailer
    description: Delete a trailer from the fleet (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Trailer ID
    responses:
      "200":
        description: Trailer deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Trailer deleted successfully"
      "404":
        description: Trailer not found
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required

/trailers/{id}/status:
  patch:
    tags:
      - Trailers
    summary: Update trailer status
    description: Update only the status of a trailer (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Trailer ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TrailerStatusUpdate"
    responses:
      "200":
        description: Trailer status updated successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Trailer"
      "400":
        description: Invalid status value
      "404":
        description: Trailer not found
      "401":
        description: Unauthorized
      "403":
        description: Forbidden - Admin role required
