version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: fleet_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend  
    container_name: fleet_backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/gestion_flotte
    depends_on:
      - mongo

  frontend:
    build: ./frontend 
    container_name: fleet_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data: